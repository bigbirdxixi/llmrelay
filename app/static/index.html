<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Relay · token 中转站控制台</title>
<style>
:root{
  --bg:#0b1016; --panel:#121a24; --panel2:#16202c; --line:#22303f;
  --fg:#e6edf5; --dim:#8ba0b6; --accent:#4f8cff; --accent2:#38bdf8;
  --ok:#34d399; --warn:#fbbf24; --err:#f87171;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",Roboto,sans-serif}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;background:var(--panel2);color:var(--fg);
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
label{display:block;font-size:12px;color:var(--dim);margin:0 0 6px}
.field{margin-bottom:14px}
.btn{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
  border-radius:8px;padding:8px 14px;transition:.15s}
.btn:hover{border-color:var(--accent);color:#fff}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#3b7bf5}
.btn.danger{color:var(--err);border-color:#3a2630}
.btn.danger:hover{background:#2a1a20}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* login */
#login{position:fixed;inset:0;background:rgba(6,10,15,.94);display:flex;
  align-items:center;justify-content:center;z-index:99}
#login .box{width:380px;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:26px}
#login h1{font-size:17px;margin:0 0 4px}
#login p{color:var(--dim);font-size:12.5px;margin:0 0 18px}
#login .hint{margin-top:12px;font-size:12px;color:var(--dim);line-height:1.6}
#login .hint code{background:var(--panel2);padding:1px 5px;border-radius:4px;color:var(--accent2)}

/* layout */
#app{display:none;min-height:100vh}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;
  padding:12px 22px;background:rgba(11,16,22,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
header .logo{font-weight:700;letter-spacing:.3px}
header .logo span{color:var(--accent)}
header .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px}
header .spacer{flex:1}
header .meta{color:var(--dim);font-size:12px}
nav{display:flex;gap:4px;padding:10px 22px 0}
nav button{background:transparent;border:none;color:var(--dim);padding:8px 14px;
  border-radius:9px 9px 0 0;border-bottom:2px solid transparent}
nav button.active{color:#fff;background:var(--panel);border-bottom-color:var(--accent)}
main{padding:18px 22px 60px;max-width:1280px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:16px}
.panel h2{font-size:14px;margin:0 0 14px;font-weight:600;display:flex;align-items:center;gap:8px}
.panel h2 small{color:var(--dim);font-weight:400}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi .k{color:var(--dim);font-size:12px}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--dim);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
/* 表格比 panel 宽时在 panel 内部横向滚动，不撑破边框 */
.tw{overflow-x:auto;overflow-y:visible;max-width:100%;margin:0 -2px;padding:0 2px}
.tw::-webkit-scrollbar{height:8px}
.tw::-webkit-scrollbar-thumb{background:#25313f;border-radius:99px}
.tw::-webkit-scrollbar-track{background:transparent}
/* 请求日志：表格按自然宽度排，panel 跟随，超出 panel 在 .tw 内横向滚动 */
#tab-logs .panel{width:max-content;max-width:100%}
#tab-logs .panel h2{flex-wrap:wrap;row-gap:6px}
.logtable{width:auto}
/* 表头内联箭头筛选：列标题旁一个小箭头，默认只显箭头，选中后追加值/"N 项"并高亮 */
th .thf{display:flex;align-items:center;gap:4px}
th.num .thf{justify-content:flex-end}
th .thfb{border:0;background:none;color:var(--dim);font-size:10px;padding:1px 5px;cursor:pointer;border-radius:5px;line-height:1.4}
th .thfb:hover{color:var(--fg);background:var(--panel2)}
th .thfb.on{color:var(--accent)}
.thfv{font-size:11px;color:var(--fg);font-family:ui-monospace,Consolas,monospace}
th .thfb.on + .thfv{color:var(--accent)}
/* 页码条 */
.pgs{display:inline-flex;gap:4px;align-items:center}
.pg{min-width:28px;padding:4px 7px;font-size:12px;text-align:center}
.pg.on{border-color:var(--accent);color:var(--accent);background:var(--panel2)}
.pgell{font-size:12px;color:var(--dim);padding:0 2px}
.thfpop{position:fixed;z-index:70;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;padding:8px;min-width:150px;max-height:280px;overflow:auto;
  box-shadow:0 10px 28px rgba(0,0,0,.55)}
.thfpop .thfph{font-size:11px;color:var(--dim);padding:0 2px 6px;border-bottom:1px solid var(--line);margin-bottom:5px}
.thfopt{display:flex;align-items:center;gap:7px;font-size:12px;padding:3px 2px;cursor:pointer;white-space:nowrap}
.thfopt input{width:auto;margin:0;accent-color:var(--accent)}
.thfopt:hover{color:var(--fg)}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--dim);font-weight:500;font-size:12px}
tr:hover td{background:#0f1620}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;
  background:#1b2634;color:var(--dim);border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:#1f4438;background:#10261f}
.pill.err{color:var(--err);border-color:#4a2530;background:#2a1419}
.pill.warn{color:var(--warn);border-color:#4a3a17;background:#241d0d}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.dim{color:var(--dim)}
.empty{color:var(--dim);text-align:center;padding:26px 0;font-size:13px}
.bar{height:6px;border-radius:99px;background:#1b2634;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
tbody tr.sel td{background:#132238}
tbody tr.sel td:first-child::before{content:"✓ ";color:#4f8cff;font-weight:700}
tbody tr:hover td{background:#101a28}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;
  display:flex;flex-direction:column;gap:8px;align-items:center}
#toast .t{background:#18232f;border:1px solid var(--line);padding:9px 16px;border-radius:9px;
  font-size:13px;box-shadow:0 8px 28px rgba(0,0,0,.45)}
#toast .t.err{border-color:#4a2530;color:#ffb4b4}
#toast .t.ok{border-color:#1f4438;color:#a7f3d0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* 概览页：活跃情况（左）× 近期活动（右）——左 45% / 右 55%：
   日历格子已改弹性列（随 panel 伸缩），留白消失；堆叠图更宽更舒展 */
.split.ov{grid-template-columns:minmax(0,9fr) minmax(0,11fr);gap:14px}
.regionmap{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
.regionmap svg .rm0{fill:var(--panel2)}
@media (max-width:900px){.split,.split.ov{grid-template-columns:1fr}.regionmap{grid-template-columns:1fr}}
#modal{position:fixed;inset:0;background:rgba(4,8,12,.72);display:none;z-index:60;
  overflow:auto;padding:40px 16px}
#modal.on{display:block}
#modal .sheet{max-width:640px;margin:0 auto;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:22px}
#modal h3{margin:0 0 16px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:99px;
  padding:4px 11px;font-size:12px;color:var(--dim)}
.chip:hover{color:#fff;border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.code{background:#0a1017;border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  font-family:ui-monospace,Consolas,monospace;font-size:12.3px;color:#b9cfe6;
  overflow:auto;white-space:pre;line-height:1.65}
.modelrows{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto}
.mrow{display:flex;align-items:center;gap:8px}
.mrow .mono.mname{flex:0 1 40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;color:var(--fg)}
.mrow select{width:132px;padding:5px 8px;font-size:12.5px}
.mrow input.mal{flex:1;min-width:130px;padding:5px 8px;font-size:12.5px}
.mrow .mdel{flex:0 0 auto;border:0;background:none;color:var(--fg);opacity:.55;font-size:16px;line-height:1;cursor:pointer;padding:2px 8px;border-radius:6px}
.mrow .mdel:hover{opacity:1;background:rgba(255,90,90,.18)}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1>LLM Relay 控制台</h1>
    <p id="loginHint">登录你的账号</p>
    <div class="field"><input id="loginEmail" type="email" placeholder="邮箱" autocomplete="username"></div>
    <div class="field"><input id="loginPass" type="password" placeholder="密码（至少 8 位）" autocomplete="current-password"></div>
    <button class="btn primary" style="width:100%" id="loginBtn" onclick="doAuth()">登录</button>
    <button class="btn" style="width:100%;margin-top:8px;display:none" id="resendVerify" onclick="resendVerify()">重发确认邮件</button>
    <p class="hint" id="pendingNote" style="display:none;margin-top:6px"></p>
    <div class="hint">
      <a href="#" onclick="toggleAuthMode();return false;" id="loginSwitch">没有账号？注册</a>
      <span id="firstTip" style="display:none">　（第一个注册的账号自动成为管理员）</span>
    </div>
  </div>
</div>

<div id="app">
  <header>
    <div class="logo">LLM <span>Relay</span></div>
    <div class="meta"><span class="dot"></span><span id="hMeta">连接中…</span></div>
    <div class="spacer"></div>
    <select id="tenantSel" style="display:none;width:190px" onchange="S.tenant=this.value;refreshAll()"></select>
    <span class="pill" id="who" style="max-width:220px;overflow:hidden;text-overflow:ellipsis"></span>
    <button class="btn sm" onclick="refreshAll()">刷新</button>
    <button class="btn sm" onclick="logout()">退出</button>
  </header>
  <nav>
    <button data-tab="overview" class="active">概览</button>
    <button data-tab="providers">上游平台</button>
    <button data-tab="usage">用量统计</button>
    <button data-tab="logs">请求日志</button>
    <button data-tab="settings">设置</button>
    <button data-tab="users" id="navUsers" style="display:none">账号</button>
  </nav>
  <main>
    <section id="tab-overview"></section>
    <section id="tab-providers" hidden></section>
    <section id="tab-usage" hidden></section>
    <section id="tab-logs" hidden></section>
    <section id="tab-settings" hidden></section>
    <section id="tab-users" hidden></section>
  </main>
</div>

<div id="modal"><div class="sheet" id="modalBody"></div></div>
<div id="toast"></div>

/* ---------------- 基础 ---------------- */
function $(sel, root){ return (root||document).querySelector(sel); }
function el(tag, attrs, html){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){ if(k === "class") e.className = attrs[k]; else e.setAttribute(k, attrs[k]); }
  if(html !== undefined) e.innerHTML = html;
  return e;
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg, kind){
  const box = $("#toast");
  const t = el("div", {class:"t " + (kind||"")}, esc(msg));
  box.appendChild(t);
  setTimeout(() => { t.style.opacity = "0"; t.style.transition = "opacity .4s"; }, 2600);
  setTimeout(() => t.remove(), 3100);
}
function nf(n){ n = Number(n||0); return n.toLocaleString("en-US"); }
function fmtTok(n){ n = Number(n||0);
  if(n >= 1e9) return (n/1e9).toFixed(2) + "B";
  if(n >= 1e6) return (n/1e6).toFixed(2) + "M";
  if(n >= 1e4) return (n/1e4).toFixed(2) + "万";
  return nf(n);
}
function fmtMs(n){ n = Number(n||0); return n >= 1000 ? (n/1000).toFixed(2)+"s" : n+"ms"; }
function shortTs(ts){ return (ts||"").replace("T"," ").slice(5,19); }
function fullTs(ts){ return (ts||"").replace("T"," ").slice(0,16); }   // 带年：2026-11-03 14:32

/* 站点可能挂在子目录（nginx: /llmrelay/ → 网关）。这里算出前缀，
   所有请求都带上它，页面挪位置也不用改代码。 */
const BASE = (function(){
  let p = location.pathname;
  if(!p.endsWith("/")) p = p.replace(/\/[^\/]*$/, "/");
  return p.replace(/\/$/, "");
})();

/* 管理员看别的账号时，给数据类接口自动带上 tenant */
function withTenant(path){
  if(!S.tenant) return path;
  if(!/^\/api\/(overview|stats|models|providers|health)/.test(path)) return path;
  return path + (path.indexOf("?") >= 0 ? "&" : "?") + "tenant=" + encodeURIComponent(S.tenant);
}

async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({}, opts.headers || {});
  if(opts.body && typeof opts.body !== "string") headers["Content-Type"] = "application/json";
  const res = await fetch(BASE + withTenant(path), Object.assign({}, opts, { headers, credentials: "same-origin",
    body: opts.body && typeof opts.body !== "string" ? JSON.stringify(opts.body) : opts.body }));
  if(res.status === 401){ showLogin(); throw new Error("未登录或 API Key 无效"); }
  if(!res.ok){
    let msg = res.status + " " + res.statusText;
    try { const j = await res.json(); msg = j.detail || j.error && (j.error.message || j.error) || JSON.stringify(j); } catch(e){}
    throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
  }
  const ct = res.headers.get("content-type") || "";
  return ct.includes("application/json") ? res.json() : res.text();
}

/* ---------------- 登录 ---------------- */
function showLogin(){
  $("#login").style.display = "flex";
  $("#app").style.display = "none";
}
function toggleAuthMode(){
  S.authMode = S.authMode === "login" ? "register" : "login";
  const reg = S.authMode === "register";
  $("#loginBtn").textContent = reg ? "注册并登录" : "登录";
  $("#loginHint").textContent = reg ? "注册一个新账号（第一个账号是管理员，其余账号需点邮件确认链接激活）" : "登录你的账号";
  $("#loginSwitch").textContent = reg ? "已经有账号？去登录" : "没有账号？注册";
  $("#firstTip").style.display = reg ? "inline" : "none";
  $("#resendVerify").style.display = "none";
  $("#pendingNote").style.display = "none";
}
/* 注册成功但邮箱未确认：不能登录，引导点邮件里的确认链接 / 重发 */
function showPending(email, mailMode){
  S.authMode = "login";
  $("#loginEmail").value = email;
  $("#loginPass").value = "";
  $("#loginBtn").textContent = "登录";
  $("#loginHint").textContent = "账号已注册！确认邮件已发往 " + email + "，点击邮件里的链接（30 分钟内有效）完成确认后即可正常登录。";
  $("#loginSwitch").textContent = "已经有账号？去登录";
  $("#firstTip").style.display = "none";
  $("#resendVerify").style.display = "block";
  $("#pendingNote").style.display = "block";
  $("#pendingNote").textContent = mailMode === "log"
    ? "当前为日志模式：确认链接写在服务器日志里（搜 [mail/log] 拿链接），浏览器打开该链接即完成确认。"
    : "若 1 分钟没收到邮件，请查垃圾邮件箱，或点击下方按钮重发。";
}
async function resendVerify(){
  const email = $("#loginEmail").value.trim();
  if(!email) return toast("先填上你注册的邮箱", "err");
  try{
    const r = await api("/api/auth/resend-verify", { method: "POST", body: { email } });
    toast(r.message || "已重发确认邮件", "ok");
    $("#resendVerify").style.display = "block";
    $("#pendingNote").style.display = "block";
    $("#pendingNote").textContent = r.message;   // 服务端消息会带模式说明（日志模式提示去日志拿链接）
  }catch(e){ toast("重发失败：" + e.message, "err"); }
}
async function doAuth(){
  const email = $("#loginEmail").value.trim();
  const password = $("#loginPass").value;
  if(!email || !password) return toast("邮箱和密码都要填", "err");
  const path = S.authMode === "register" ? "/api/auth/register" : "/api/auth/login";
  try{
    const r = await api(path, { method: "POST", body: { email, password } });
    if(r.pending){ showPending(email, r.mail_mode || "smtp"); return; }   // 邮箱未确认：注册成功但不放行登录
    S.user = r.user;
    localStorage.removeItem("relay_key");
    await enterApp();
  }catch(e){
    if(String(e.message).includes("email_unverified")){   // 登录被邮箱确认拦住
      showPending(email, "smtp");
      toast("邮箱未确认：请点邮件里的确认链接，或重发确认邮件", "err");
      return;
    }
    toast((S.authMode === "register" ? "注册失败：" : "登录失败：") + e.message, "err");
  }
}
async function logout(){
  try{ await api("/api/auth/logout", { method: "POST" }); }catch(e){}
  S.user = null; S.tenant = "";
  localStorage.removeItem("relay_key");
  $("#loginEmail").value = ""; $("#loginPass").value = "";
  showLogin();
}
async function enterApp(){
  const st = S.user ? null : await api("/api/auth/status");
  if(st && !st.user) return showLogin();
  if(st) S.user = st.user;
  $("#who").textContent = S.user.email + (S.user.role === "admin" ? " · 管理员" : "");
  $("#navUsers").style.display = S.user.role === "admin" ? "" : "none";
  $("#login").style.display = "none";
  $("#app").style.display = "block";
  await buildTenantPicker();
  await refreshAll();
}
async function buildTenantPicker(){
  const sel = $("#tenantSel");
  if(S.user.role !== "admin"){ sel.style.display = "none"; return; }
  const r = await api("/api/users");
  const opts = [`<option value="">只看我的数据</option>`, `<option value="all">全部账号（汇总）</option>`]
    .concat((r.data || []).map(u => `<option value="${u.id}">${esc(u.email)}</option>`));
  sel.innerHTML = opts.join("");
  sel.value = S.tenant;
  sel.style.display = "";
}

/* ---------------- 图表 ---------------- */

function lineChart(series, opts){
  opts = opts || {};
  const yFmt = opts.yFmt || fmtTok;
  const labels = opts.labels || {};
  const rows = series.rows || [];
  const allKeys = series.keys || series.platforms || [];
  if(!rows.length) return '<div class="empty">还没有数据，先去发一个请求吧</div>';
  const keys = allKeys.filter(k => !opts.selected || opts.selected.length === 0
                                   || opts.selected.indexOf(k) >= 0);
  if(!keys.length) return '<div class="empty">没有选中的曲线 —— 点上面的列表选中几项</div>';
  const W = 900, H = 240, P = {l:52, r:14, t:14, b:26};
  let maxV = 1;
  rows.forEach(r => keys.forEach(k => { maxV = Math.max(maxV, Number(r[k]||0)); }));
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const x = i => P.l + (rows.length <= 1 ? iw/2 : iw * i / (rows.length - 1));
  const y = v => P.t + ih - ih * (v / maxV);
  let g = "";
  for(let i = 0; i <= 4; i++){
    const yy = P.t + ih * i / 4, val = maxV * (1 - i/4);
    g += `<line x1="${P.l}" y1="${yy}" x2="${W-P.r}" y2="${yy}" stroke="#1c2836" stroke-width="1"/>`;
    g += `<text x="${P.l-8}" y="${yy+4}" fill="#5c7387" font-size="10" text-anchor="end">${yFmt(val)}</text>`;
  }
  const step = Math.max(1, Math.ceil(rows.length / 8));
  rows.forEach((r, i) => {
    if(i % step === 0 || i === rows.length-1)
      g += `<text x="${x(i)}" y="${H-8}" fill="#5c7387" font-size="10" text-anchor="middle">${r.day.slice(5)}</text>`;
  });
  const colorOf = k => PALETTE[Math.max(0, allKeys.indexOf(k)) % PALETTE.length];
  let paths = "", legend = "";
  keys.forEach(k => {
    const color = colorOf(k);
    const pts = [];
    rows.forEach((r, i) => {
      const v = Number(r[k] || 0);
      if(v === 0 && !pts.length) return;      // 跳过前导 0
      pts.push([x(i), y(v)]);
    });
    if(pts.length === 1){
      // 只有一个数据点：画个圆点，路径只有 M 指令是画不出线的
      paths += `<circle cx="${pts[0][0].toFixed(1)}" cy="${pts[0][1].toFixed(1)}" r="4" fill="${color}"/>`;
    } else if(pts.length > 1){
      const d = pts.map((pt, i) => (i ? " L" : "M") + pt[0].toFixed(1) + " " + pt[1].toFixed(1)).join("");
      paths += `<path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`;
    }
    legend += `<span><i style="background:${color}"></i>${esc(labels[k] || k)}</span>`;
  });
  let total = "";
  if(keys.length > 1 && !opts.noTotal){
    const tp = rows.map((r, i) => [x(i), y(Number(r.total || 0))]);
    if(tp.length === 1){
      total = `<circle cx="${tp[0][0].toFixed(1)}" cy="${tp[0][1].toFixed(1)}" r="3" fill="#ffffff40"/>`;
    } else {
      const d = tp.map((pt, i) => (i ? " L" : "M") + pt[0].toFixed(1) + " " + pt[1].toFixed(1)).join("");
      total = `<path d="${d}" fill="none" stroke="#ffffff26" stroke-width="1.2" stroke-dasharray="4 4"/>`;
    }
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">${g}${total}${paths}</svg>
          <div class="legend">${legend}${keys.length>1?'<span><i style="background:#ffffff26"></i>合计（虚线）</span>':""}</div>`;
}

function _pick(dim){
  S.pick = S.pick || {};
  return (S.pick[dim] = S.pick[dim] || []);
}

/* 点用量表行 → 选中或取消，曲线立刻跟着变 */
function togglePick(el){
  const dim = el.dataset.dim, k = el.dataset.k;
  if(dim !== "usage") return;
  const cur = _pick(dim);
  const i = cur.indexOf(k);
  if(i >= 0) cur.splice(i, 1); else cur.push(k);
  const box = $("#usageChart");
  if(box) box.innerHTML = usageChartHtml();
  el.classList.toggle("sel", i < 0);
}

function usageChartHtml(){
  const ds = (S.ds && S.ds.usage) || {days: [], rows: [], keys: []};
  const sel = _pick("usage");
  return lineChart(ds, {selected: sel});
}

/* 延迟曲线：每日 平均 / P95 / TTFT 三线（y 轴 ms，无合计线） */
function latencyChartHtml(data){
  const ds = data || {days: [], rows: [], keys: ["avg","p95","ttft"]};
  return lineChart(ds, {yFmt: fmtMs, noTotal: true,
    labels: {avg: "平均", p95: "P95", ttft: "TTFT 平均"}});
}

/* 每日 tokens 堆叠柱（按平台）；图例可点选：S.pick.platStack 非空时只显示选中平台的堆叠 */
function stackedBarHtml(series){
  const rows = series.rows || [], keys = series.keys || [];
  if(!rows.length || !keys.length) return '<div class="empty">这个区间还没有请求记录</div>';
  const sel = _pick("platStack");
  const totals = keys.map(k => rows.reduce((a, r) => a + Number(r[k] || 0), 0));
  const order = keys.map((k, i) => [k, totals[i]])
    .filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).map(x => x[0]);
  const active = sel.length ? order.filter(k => sel.indexOf(k) >= 0) : order;
  const color = k => PALETTE[order.indexOf(k) % PALETTE.length];
  const W = 900, H = 220, P = {l: 52, r: 14, t: 14, b: 26};
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const n = rows.length, bw = iw / n;
  const maxV = Math.max(1, ...rows.map(r => active.reduce((a, k) => a + Number(r[k] || 0), 0)));
  const y = v => P.t + ih - ih * (v / maxV);
  let g = "";
  for(let i = 0; i <= 3; i++){
    const yy = P.t + ih * i / 3, val = maxV * (1 - i / 3);
    g += `<line x1="${P.l}" y1="${yy}" x2="${W-P.r}" y2="${yy}" stroke="#1c2836" stroke-width="1"/>`;
    g += `<text x="${P.l-8}" y="${yy+4}" fill="#5c7387" font-size="10" text-anchor="end">${fmtTok(val)}</text>`;
  }
  const step = Math.max(1, Math.ceil(n / 8));
  rows.forEach((r, i) => {
    if(i % step === 0 || i === n - 1)
      g += `<text x="${P.l + i*bw + bw/2}" y="${H-8}" fill="#5c7387" font-size="10" text-anchor="middle">${r.day.slice(5)}</text>`;
  });
  let bars = "";
  rows.forEach((r, i) => {
    let cum = 0;
    const x = P.l + i*bw + 1, w = Math.max(2, bw - 2);
    active.forEach(k => {
      const v = Number(r[k] || 0);
      if(!v) return;
      const y1 = y(cum + v), h = y(cum) - y1;
      bars += `<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${w}" height="${h.toFixed(1)}"
        fill="${color(k)}" opacity="0.85">
        <title>${r.day} · ${esc(k)} · ${fmtTok(v)} tokens</title></rect>`;
      cum += v;
    });
  });
  const legend = order.map(k => {
    const on = !sel.length || sel.indexOf(k) >= 0;
    return `<span style="cursor:pointer;opacity:${on ? 1 : 0.4}" title="点一下只看该平台"
      onclick="togglePlatStack('${esc(k)}')"><i style="background:${color(k)}"></i>${esc(k)}</span>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">${g}${bars}</svg>
    <div class="legend">${legend}</div>
    ${sel.length ? `<div class="dim" style="font-size:11.5px;margin-top:4px">已按选中平台过滤 · 再点图例可增减</div>` : ""}`;
}
function togglePlatStack(k){
  const sel = _pick("platStack");
  const i = sel.indexOf(k);
  if(i >= 0) sel.splice(i, 1); else sel.push(k);
  renderUsage();
}

/* 环形图：Top N + 其他，中心显合计 */
function donutHtml(items, centerLabel){
  const total = items.reduce((a, x) => a + Number(x.v || 0), 0);
  if(!total) return '<div class="empty">这个区间还没有请求记录</div>';
  const R = 55, C = 2 * Math.PI * R;
  let off = 0, segs = "";
  items.forEach((it, i) => {
    const frac = Number(it.v) / total, color = PALETTE[i % PALETTE.length];
    segs += `<circle cx="80" cy="80" r="${R}" fill="none" stroke="${color}" stroke-width="26"
      stroke-dasharray="${(frac*C).toFixed(1)} ${C.toFixed(1)}" stroke-dashoffset="${(-off*C).toFixed(1)}"
      transform="rotate(-90 80 80)"><title>${esc(it.k)} · ${fmtTok(it.v)} · ${Math.round(frac*100)}%</title></circle>`;
    off += frac;
  });
  const legend = items.map((it, i) =>
    `<div class="row" style="gap:8px;margin:4px 0"><i style="width:10px;height:10px;border-radius:3px;
      background:${PALETTE[i % PALETTE.length]};flex:none"></i>
      <span class="mono" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(it.k)}">${esc(it.k)}</span>
      <span class="dim" style="font-size:12px">${Math.round(100 * Number(it.v) / total)}%</span></div>`).join("");
  return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
    <svg width="160" height="160" viewBox="0 0 160 160" style="flex:none">${segs}
      <text x="80" y="76" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">${centerLabel || fmtTok(total)}</text>
      <text x="80" y="94" text-anchor="middle" fill="#5c7387" font-size="10">合计</text></svg>
    <div style="flex:1;min-width:220px;max-width:420px">${legend}</div></div>`;
}

/* 星期 × 小时 请求量热力图 */
function heatmapHtml(data){
  const mx = data.max || 0;
  if(!mx) return '<div class="empty">这个区间还没有请求记录</div>';
  const cell = 19, gap = 3;
  const HOURS = [...Array(24).keys()];
  let head = `<div style="display:grid;grid-template-columns:40px repeat(24, ${cell}px);gap:${gap}px;margin-bottom:2px">
    <span></span>${HOURS.map(h => `<span style="font-size:9.5px;color:var(--dim);text-align:center">${h % 3 === 0 ? h : ""}</span>`).join("")}</div>`;
  let grid = data.matrix.map((row, wd) =>
    `<div style="display:grid;grid-template-columns:40px repeat(24, ${cell}px);gap:${gap}px">
      <span style="font-size:11px;color:var(--dim);line-height:${cell}px">${data.labels[wd]}</span>
      ${row.map((v, h) => {
        const a = v ? 0.18 + 0.82 * Math.sqrt(v / mx) : 0;
        return `<i title="${data.labels[wd]} ${String(h).padStart(2, "0")}:00 · ${nf(v)} 次"
          style="width:${cell}px;height:${cell}px;border-radius:4px;display:block;
          background:${v ? `rgba(79,140,255,${a.toFixed(2)})` : "var(--panel2)"}"></i>`;
      }).join("")}</div>`).join("");
  return `<div style="overflow-x:auto"><div style="min-width:fit-content">${head}${grid}</div>
    <div class="dim" style="font-size:11.5px;margin-top:6px">颜色深浅 = 该星期几该小时的请求量（近 ${data.days} 天合并）</div></div>`;
}

/* 结构组成：小组横向条形（协议/流式/状态/思考策略/错误码） */
function mixBarRow(title, obj){
  const total = Object.values(obj).reduce((a, v) => a + Number(v || 0), 0) || 1;
  const rows = Object.entries(obj).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]).map(([k, v]) =>
    `<div class="row" style="gap:8px;margin:4px 0"><span style="width:92px;font-size:12px">${esc(k)}</span>
      <div class="bar" style="flex:1"><i style="width:${Math.max(2, Math.round(100 * v / total))}%"></i></div>
      <span class="num dim" style="font-size:12px;width:110px;text-align:right">${nf(v)} · ${Math.round(100 * v / total)}%</span></div>`).join("");
  return `<div style="margin-bottom:12px"><div style="font-size:12.5px;color:var(--dim);margin-bottom:2px">${title}</div>
    ${rows || '<div class="dim" style="font-size:12px">无记录</div>'}</div>`;
}
function mixPanelHtml(mix){
  mix = mix || {};
  return mixBarRow("下游协议", mix.by_in_format) +
         mixBarRow("流式 / 普通", mix.by_stream) +
         mixBarRow("请求状态", mix.by_status) +
         mixBarRow("思考策略", mix.by_reasoning) +
         mixBarRow("错误 HTTP 码", mix.by_http_error);
}

/* 错误摘要：Top 原因列表 */
function errorsHtml(list){
  if(!list.length) return '<div class="empty">这个区间没有错误，稳得很</div>';
  const rows = list.map(e => `<tr>
      <td><span class="pill err">${esc(e.http_status || "?")}</span></td>
      <td class="mono" style="max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(e.reason)}">${esc(e.reason)}</td>
      <td class="num"><b>${nf(e.c)}</b></td>
      <td class="num dim">${esc(String(e.last || "").replace("T", " ").slice(5, 16))}</td></tr>`).join("");
  return `<table><thead><tr><th>HTTP</th><th>错误原因</th><th class="num">次数</th><th class="num">末次出现</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="dim" style="font-size:11.5px;margin-top:6px">按次数取 Top ${list.length}，同一原因不同 HTTP 码分开列</div>`;

/* 活动柱状图：柱高=该桶 tokens；该桶有错误则红色；悬浮看明细。
   xLabel/tipLabel 出 x 轴标签与悬浮文案，every 是标签间隔（桶数）。 */
function hourlyBarHtml(buckets, xLabel, tipLabel, every){
  const W = 760, H = 170, P = {l: 52, r: 8, t: 12, b: 24};
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const n = buckets.length || 1;
  const maxV = Math.max(1, ...buckets.map(h => Number(h.tokens || 0)));
  const bw = iw / n;
  let g = "";
  for(let i = 0; i <= 3; i++){
    const yy = P.t + ih * i / 3, val = maxV * (1 - i / 3);
    g += `<line x1="${P.l}" y1="${yy}" x2="${W-P.r}" y2="${yy}" stroke="#1c2836" stroke-width="1"/>`;
    g += `<text x="${P.l-8}" y="${yy+4}" fill="#5c7387" font-size="10" text-anchor="end">${fmtTok(val)}</text>`;
  }
  buckets.forEach((h, i) => { if(i % every === 0)
    g += `<text x="${P.l + i*bw + bw/2}" y="${H-8}" fill="#5c7387" font-size="10" text-anchor="middle">${xLabel(h)}</text>`; });
  let bars = "";
  buckets.forEach((h, i) => {
    const v = Number(h.tokens || 0), r = Number(h.requests || 0), e = Number(h.errors || 0);
    if(!v && !r) return;
    const bh = Math.max(3, ih * (v / maxV));
    const x = P.l + i*bw + 2.5, y = P.t + ih - bh, w = Math.max(2, bw - 5);
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w}" height="${bh.toFixed(1)}" rx="2"
      fill="${e ? "var(--err)" : "var(--accent)"}" fill-opacity="0.75">
      <title>${tipLabel(h)} · ${nf(r)} 请求 · ${fmtTok(v)} tokens${e ? ` · ${e} 错误` : ""}</title></rect>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">${g}${bars}</svg>
    <div class="dim" style="font-size:11.5px;margin-top:4px">柱高 = 该时段 tokens 总量 · 红色 = 该时段出现错误 · 悬浮看明细</div>`;
}

/* 近期活动：每桶按 平台/模型 堆叠（Top 6 + 其他），配色与图例同 stackedBarHtml；
   图例可点选：S.pick.ovStack 非空时只显示选中维度的堆叠 */
function hourlyStackedHtml(buckets, skey, xLabel, tipLabel, every){
  const keyTot = {};
  for (const b of buckets){
    const m = b[skey] || {};
    for (const [k, v] of Object.entries(m)) keyTot[k] = (keyTot[k] || 0) + Number(v || 0);
  }
  const all = Object.entries(keyTot).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  const top = all.slice(0, 6).map(x => x[0]);
  const rest = all.slice(6).map(x => x[0]);
  const order = rest.length ? [...top, "其他"] : top.slice();
  const sel = _pick("ovStack");
  const active = sel.length ? order.filter(k => sel.indexOf(k) >= 0) : order;
  const colorOf = k => PALETTE[order.indexOf(k) % PALETTE.length];
  const W = 760, H = 170, P = {l: 52, r: 8, t: 12, b: 24};
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const n = buckets.length || 1;
  const bw = iw / n;
  const valOf = (b, k) => {
    const m = b[skey] || {};
    return k === "其他" ? rest.reduce((a, kk) => a + Number(m[kk] || 0), 0) : Number(m[k] || 0);
  };
  const maxV = Math.max(1, ...buckets.map(b => active.reduce((a, k) => a + valOf(b, k), 0)));
  let g = "";
  for(let i = 0; i <= 3; i++){
    const yy = P.t + ih * i / 3, val = maxV * (1 - i / 3);
    g += `<line x1="${P.l}" y1="${yy}" x2="${W-P.r}" y2="${yy}" stroke="#1c2836" stroke-width="1"/>`;
    g += `<text x="${P.l-8}" y="${yy+4}" fill="#5c7387" font-size="10" text-anchor="end">${fmtTok(val)}</text>`;
  }
  buckets.forEach((h, i) => { if(i % every === 0)
    g += `<text x="${P.l + i*bw + bw/2}" y="${H-8}" fill="#5c7387" font-size="10" text-anchor="middle">${xLabel(h)}</text>`; });
  let bars = "";
  buckets.forEach((h, i) => {
    let cum = 0;
    const total = active.reduce((a, k) => a + valOf(h, k), 0);
    if(!total) return;
    const x = P.l + i*bw + 2.5, w = Math.max(2, bw - 5);
    for (const k of active){
      const v = valOf(h, k);
      if(!v) continue;
      const y1 = P.t + ih * (1 - (cum + v) / maxV), hgt = ih * (v / maxV);
      bars += `<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${w}" height="${hgt.toFixed(1)}"
        fill="${colorOf(k)}" opacity="0.85">
        <title>${tipLabel(h)} · ${esc(k)} · ${fmtTok(v)} tokens（占该时段 ${(100 * v / total).toFixed(0)}%）</title></rect>`;
      cum += v;
    }
  });
  const legend = order.map(k => {
    const on = !sel.length || sel.indexOf(k) >= 0;
    return `<span style="cursor:pointer;opacity:${on ? 1 : 0.4}" title="点一下只看该维度"
      onclick="toggleOvStack('${esc(k)}')"><i style="background:${colorOf(k)}"></i>${esc(k)}</span>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">${g}${bars}</svg>
    <div class="legend">${legend}</div>
    ${sel.length ? `<div class="dim" style="font-size:11.5px;margin-top:4px">已按选中维度过滤 · 再点图例可增减</div>` : ""}`;
}
function toggleOvStack(k){
  const sel = _pick("ovStack");
  const i = sel.indexOf(k);
  if(i >= 0) sel.splice(i, 1); else sel.push(k);
  renderOverview();
}

/* 活跃情况（概览）：所选年份的「星期 × 月份」日历（纵轴=星期、横轴=1~12 月），
   格子深浅 = 该月该星期几的请求量合计；颜色为绿色深浅（主题 --ok），
   与用量统计「星期 × 时段」蓝色热力图区分；
   d 为 /api/stats/year 响应 {year, cells[12][7]{requests,tokens,errors},
   total_requests, total_tokens, active_days, years[]}，cells 恒为完整 12×7 */
function yearlyActivityHtml(d){
  if(!d || !Array.isArray(d.cells)) return '<div class="empty">这一年还没有请求记录</div>';
  const Y = d.year;
  const maxV = Math.max(1, ...d.cells.flat().map(c => Number(c.requests || 0)));
  const cellH = 26, gap = 3;
  const cols = "34px repeat(12, minmax(20px, 1fr))";   // 月份列弹性：格子随 panel 宽度伸缩
  const names = ["一", "二", "三", "四", "五", "六", "日"];   // 纵轴：星期
  const colHead = `<div style="display:grid;grid-template-columns:${cols};gap:${gap}px;margin-bottom:2px">
    <span></span>${[...Array(12).keys()].map(m =>
      `<span style="font-size:10px;color:var(--dim);text-align:center">${m + 1}月</span>`).join("")}</div>`;
  const grid = names.map((nm, w) => {
    const cells = d.cells.map((mc, m) => {
      const c = mc[w];
      const req = Number(c.requests || 0);
      if(!req) return `<i style="width:100%;height:${cellH}px;border-radius:4px;display:block;background:var(--panel2)"></i>`;
      const a = 0.18 + 0.82 * Math.sqrt(req / maxV);
      return `<i title="${Y} 年 ${m + 1} 月 · 周${nm} · ${nf(req)} 次 · ${fmtTok(c.tokens)} tokens${c.errors ? " · " + nf(c.errors) + " 错误" : ""}"
        style="width:100%;height:${cellH}px;border-radius:4px;display:block;
        background:rgba(52,211,153,${a.toFixed(2)})"></i>`;
    }).join("");
    return `<div style="display:grid;grid-template-columns:${cols};gap:${gap}px">
      <span style="font-size:11px;color:var(--dim);line-height:${cellH}px">周${nm}</span>${cells}</div>`;
  }).join("");
  return `<div style="overflow-x:auto"><div style="min-width:fit-content">${colHead}${grid}</div>
    <div class="dim" style="font-size:11.5px;margin-top:6px">颜色深浅 = 该月该星期的请求量（${Y} 年 · 活跃 ${nf(d.active_days || 0)} 天 · 共 ${nf(d.total_requests || 0)} 次 / ${fmtTok(d.total_tokens || 0)} tokens）</div></div>`;
}
/* 年份下拉框：选项 = 有数据的年份 ∪ 浏览器当前年（倒序），onchange 触发重新取数 */
function ovYearSelectHtml(d, yr){
  const set = new Set(d && d.years ? d.years : []);
  set.add(String(new Date().getFullYear()));
  const opts = [...set].sort((a, b) => Number(b) - Number(a)).map(y =>
    `<option value="${y}" ${String(y) === String(yr) ? "selected" : ""}>${y} 年</option>`).join("");
  return `<select id="ovYear" style="width:100px" onchange="ovYearPick(this.value)">${opts}</select>`;
}
/* 地域访问地图：点击省份下钻城市排名（S.regPick 记忆选中省；再点同一省取消） */
function pickProv(p){ S.regPick = S.regPick === p ? "" : p; renderOverview(); }
/* 地域访问地图：中国省级 SVG 着色（深浅=该省请求数）+ 右侧境外/局域网侧栏 */
function regionMapHtml(rg){
  if(!rg) return "";
  if(rg.db === "missing"){
    return '<div class="dim" style="padding:14px 0;font-size:12.5px;line-height:1.7">'
      + '未配置 GeoIP 数据库，地域地图暂不显示。'
      + '下载 <span class="mono">GeoLite2-City.mmdb</span>（MaxMind 免费）放入数据目录（'
      + '<span class="mono">RELAY_DATA_DIR</span>）或设置 <span class="mono">RELAY_GEOIP_DB</span> 后重启即可；'
      + '国内 IP 城市级定位更准可再放一份 <span class="mono">IP2Region.xdb</span>（开源免费，RELAY_IP2REGION_XDB）。<div>';
  }
  const byProv = {}; const world = []; let localN = 0, unkN = 0, cnFallN = 0;
  for(const d of rg.data){
    if(d.kind === "cn"){
      // 只有匹配地图省份键的才上着色；「中国大陆」等兜底桶进侧栏
      if(CHINA_PROVINCE_PATHS[d.region]) byProv[d.region] = (byProv[d.region] || 0) + d.count;
      else cnFallN += d.count;
    }
    else if(d.kind === "world") world.push(d);
    else if(d.kind === "local") localN += d.count;
    else unkN += d.count;
  }
  const max = Math.max(1, ...Object.values(byProv));
  const sel = S.regPick || "";
  let paths = "";
  for(const p of Object.keys(CHINA_PROVINCE_PATHS)){
    const d = CHINA_PROVINCE_PATHS[p];
    if(!d) continue;
    const v = byProv[p] || 0;
    const fill = v > 0 ? "rgba(79,140,255," + (0.25 + 0.75 * Math.sqrt(v / max)).toFixed(2) + ")" : "";
    const tip = "<title>" + esc(p) + (v > 0 ? " · " + nf(v) + " 次" : " · 区间内无请求")
      + (sel === p ? "（再点取消）" : "（点击查看城市排名）") + "</title>";
    paths += '<path d="' + d + '"'
      + (v > 0 ? ' fill="' + fill + '"' : ' fill="var(--panel2)"')
      + ' style="cursor:pointer" onclick="pickProv(\'' + p + '\')"'
      + (sel === p ? ' stroke="#ff8a5c" stroke-width="1.8"' : ' stroke="var(--line)" stroke-width="0.8"')
      + '>' + tip + '</path>';
  }
  // 城市热点层：后端 lat/lon 用与省路径同一套等距圆柱投影（15.14964 px/度）落到同一 viewBox
  const cts = (rg.cities || []).filter(c => c.kind === "cn" && isFinite(c.lat) && isFinite(c.lon));
  let dots = "";
  if(cts.length){
    const cmax = Math.max.apply(null, cts.map(c => c.count));
    const top = cts.slice(0, 30);
    top.forEach((c, i) => {
      const x = 15.14964 * c.lon - 1080.1038;
      const y = -15.14966 * c.lat + 811.477;
      if(x < 0 || x > 1000 || y < 0 || y > 760) return;
      const ratio = Math.sqrt(c.count / cmax);
      const r = 3 + 9 * ratio;
      dots += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r.toFixed(1) + '"'
        + ' fill="#ff8a5c" fill-opacity="' + (0.5 + 0.5 * ratio).toFixed(2)
        + '" stroke="#ffd9c2" stroke-width="0.8"><title>'
        + esc(c.name) + " · " + nf(c.count) + " 次</title></circle>";
      if(i < 3) dots += '<text x="' + (x + r + 4).toFixed(1) + '" y="' + (y + 4).toFixed(1)
        + '" font-size="14" fill="var(--fg)" stroke="none">' + esc(c.name) + "</text>";
    });
  }
  const side = [];
  // 省/城排名横条：默认省份 Top10；点了某省 → 该省城市排名（cities 带 region 字段，前端过滤）
  // 排位（用户拍板）：境外/局域网/未识别 → 色深说明 → 区间总次数 → 中国大陆（未解析到省） → 排名图表
  const barRow = (rank, name, cnt, m, color) =>
    '<div class="row" style="gap:6px;margin:3px 0"><span style="width:16px;font-size:11px;color:var(--dim);text-align:right;flex:none">' + rank + '</span>'
    + '<span style="width:64px;font-size:12px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + esc(name) + '">' + esc(name) + '</span>'
    + '<span style="flex:1;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;display:block"><i style="display:block;height:100%;width:'
    + Math.max(4, Math.round(100 * cnt / m)) + '%;background:' + color + ';font-style:normal"></i></span>'
    + '<span style="font-size:12px" class="dim">' + nf(cnt) + "</span></div>";
  if(world.length){
    const top = world.slice(0, 10);
    const wmax = Math.max.apply(null, top.map(x => x.count));
    side.push('<div style="font-size:12px;margin:10px 0 4px">境外 · Top ' + top.length + "</div>"
      + top.map(x => '<div class="row" style="gap:6px;margin:3px 0"><span style="width:64px;font-size:12px;flex:none">'
        + esc(x.region) + '</span><span style="flex:1;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;display:block">'
        + '<i style="display:block;height:100%;width:' + Math.max(4, Math.round(100 * x.count / wmax)) + '%;background:#4f8cff;font-style:normal"></i></span>'
        + '<span style="font-size:12px" class="dim">' + nf(x.count) + "</span></div>").join(""));
  }
  if(localN) side.push('<div class="dim" style="font-size:12px;margin-top:8px">局域网 / 代理出口 ' + nf(localN) + " 次</div>");
  if(unkN) side.push('<div class="dim" style="font-size:12px">未识别 ' + nf(unkN) + " 次</div>");
  // 色深说明放最上（在排名图表之上）
  side.push('<div class="dim" style="font-size:11.5px;margin-top:10px;line-height:1.6">色深 = 该省请求次数 · 橙点 = 城市热点（面积 ∝ 请求数，仅显 Top 30）· 按客户端 IP 定位（公司出口 / 代理 IP 会合并到同一地区）</div>');
  // 区间总次数：色深说明之下（用户拍板）
  side.push('<div style="font-size:12px" class="dim">区间内带 IP 记录请求 <b style="color:var(--fg)">' + nf(rg.total) + "</b> 次</div>");
  // 中国大陆（未解析到省）行：紧接总次数之下
  if(cnFallN) side.push('<div class="dim" style="font-size:12px;margin-top:8px">中国大陆（未解析到省）' + nf(cnFallN) + " 次</div>");
  // 排名图表放最底部：默认省份 Top10；点了某省 → 该省城市排名
  if(sel){
    const pc = (rg.cities || []).filter(c => c.kind === "cn" && c.region === sel);
    const pm = Math.max(1, ...pc.map(c => c.count));
    side.push('<div style="font-size:12px;margin:10px 0 4px">' + esc(sel) + " · 城市 Top " + pc.length
      + ' <button class="btn sm" style="margin-left:8px;padding:1px 8px" onclick="pickProv(\'' + sel + '\')">取消</button></div>');
    if(pc.length) side.push(pc.map((c, i) => barRow(i + 1, c.name, c.count, pm, "#ff8a5c")).join(""));
    else side.push('<div class="dim" style="font-size:12px">'
      + ((byProv[sel] || 0) ? "该省暂无城市级数据（IP 未解析到城市名）"
                             : "该省在所选区间内没有请求记录") + "</div>");
  } else {
    const provTop = Object.entries(byProv).sort((a, b) => b[1] - a[1]).slice(0, 10);
    if(provTop.length){
      side.push('<div style="font-size:12px;margin:10px 0 4px">省份 · Top ' + provTop.length
        + ' <span class="dim" style="font-size:11px">· 点省份看城市排名</span></div>');
      side.push(provTop.map(([n, c], i) => barRow(i + 1, n, c, provTop[0][1], "#4f8cff")).join(""));
    }
  }
  return '<div class="regionmap"><svg viewBox="0 0 1000 760" style="width:100%;max-width:620px;height:auto;'
    + 'background:var(--panel);border:1px solid var(--line);border-radius:10px">' + paths + dots + "</svg>"
    + '<div style="min-width:0">' + side.join("") + "</div></div>";
}

function ovYearPick(v){ S.ovYear = v; renderOverview(); }

/* 概览活动图的时间范围：今日按小时 / 7 天按天 / 30 天按天 */
function setOvPeriod(p){ S.ovPeriod = p; if(S.pick) S.pick.ovStack = []; renderOverview(); }
function bucketOpts(p){
  if(p === 1) return {every: 3, x: h => String(h.h), tip: h => String(h.h) + ":00"};
  if(p === 7) return {every: 1, x: h => String(h.h).slice(5), tip: h => String(h.h)};
  return {every: 5, x: h => String(h.h).slice(5), tip: h => String(h.h)};
}

/* ---------------- 概览 ---------------- */

async function renderOverview(){
  const box = $("#tab-overview");
  const ov = S.overview;
  if(!ov) return;
  const t = ov.totals;
  const p = S.ovPeriod || 1;
  const split = S.ovSplit || "platform";
  // 活跃情况：选定的年份（默认浏览器当前年），按 ts 年份前缀精确取数
  const curYear = String(new Date().getFullYear());
  const yr = S.ovYear || curYear;
  const yearUrl = `/api/stats/year?year=${yr}`;
  // KPI 永远基于今日；活动图按所选时间范围（今日按小时，7/30 天按天）+ 平台/模型维度堆叠；
  // 年度活跃固定取所选年份按「星期 × 月份」的请求量
  const h1 = await api(`/api/stats/hourly?days=1&group=hour&split=${split}`);
  const hd = h1.today || h1.total || {requests: 0, errors: 0, avg_latency_ms: 0};
  const rgRange = p === 1 ? "today" : (p === 7 ? "7d" : "30d");
  const [chart, act, rg] = p === 1
    ? await Promise.all([h1, api(yearUrl), api(`/api/stats/regions?range=${rgRange}`)])
    : await Promise.all([
        api(`/api/stats/hourly?days=${p}&group=day&split=${split}`),
        api(yearUrl),
        api(`/api/stats/regions?range=${rgRange}`),
      ]);
  const oc = bucketOpts(p);
  const gran = p === 1 ? "按小时" : (p === 7 ? "近 7 天 · 按天" : "近 30 天 · 按天");
  const okRate = hd.requests ? (100 * (hd.requests - hd.errors) / hd.requests).toFixed(1) : "100.0";
  const splitChart = split === "none"
    ? hourlyBarHtml(chart.buckets || [], oc.x, oc.tip, oc.every)
    : hourlyStackedHtml(chart.buckets || [], split === "platform" ? "by_platform" : split === "dkey" ? "by_dkey" : "by_model",
                        oc.x, oc.tip, oc.every);
  const actChart = yearlyActivityHtml(act);
  box.innerHTML = `
    <div class="grid kpis" style="margin-bottom:16px">
      <div class="kpi"><div class="k">今日请求</div><div class="v">${nf(t.today_requests)}</div>
        <div class="s">累计 ${nf(t.total_requests)} 次</div></div>
      <div class="kpi"><div class="k">今日 tokens</div><div class="v">${fmtTok(t.today_tokens)}</div>
        <div class="s">入 ${fmtTok(t.today_prompt_tokens)} / 出 ${fmtTok(t.today_completion_tokens)}</div></div>
      <div class="kpi"><div class="k">成功率</div><div class="v">${okRate}<span class="dim" style="font-size:14px">%</span></div>
        <div class="s">今日错误 ${nf(hd.errors)}</div></div>
      <div class="kpi"><div class="k">平均耗时</div><div class="v">${fmtMs(hd.avg_latency_ms)}</div>
        <div class="s">今日均值 · 整体 ${fmtMs(t.avg_latency_ms)}</div></div>
      <div class="kpi"><div class="k">累计 tokens</div><div class="v">${fmtTok(t.total_tokens)}</div>
        <div class="s">其中缓存命中 ${fmtTok(t.total_cached_tokens)}</div></div>
      <div class="kpi"><div class="k">上游平台</div><div class="v">${nf(ov.enabled_providers)}<span class="dim" style="font-size:14px"> / ${nf(ov.providers)}</span></div>
        <div class="s">可用模型 ${nf(ov.models)} 个</div></div>
    </div>
    <div class="split ov">
      <div class="panel">
        <h2>活跃情况 <small>请求量日历 · 纵轴为星期、横轴为月份 · 格子深浅 = 该月该星期请求次数</small>
          <span style="flex:1"></span>
          ${ovYearSelectHtml(act, yr)}
        </h2>
        ${actChart}
      </div>
      <div class="panel">
      <h2>近期活动 <small>${gran} · 纵轴为 tokens · ${{"none":"合计","platform":"按上游平台堆叠","model":"按模型堆叠","dkey":"按下游 key 堆叠"}[split] || "合计"}${(S.pick && S.pick.ovStack || []).length ? " · 已选 " + S.pick.ovStack.length + " 项" : ""}</small>
        <span style="flex:1"></span>
        ${(S.pick && S.pick.ovStack || []).length ? '<button class="btn sm" onclick="S.pick.ovStack=[];renderOverview()">重置</button>' : ""}
        <select id="ovSplit" style="width:150px" onchange="S.ovSplit=this.value;if(S.pick)S.pick.ovStack=[];renderOverview()">
          <option value="none" ${split==="none"?"selected":""}>显示合计</option>
          <option value="platform" ${split==="platform"?"selected":""}>按平台堆叠</option>
          <option value="model" ${split==="model"?"selected":""}>按模型堆叠</option>
          <option value="dkey" ${split==="dkey"?"selected":""}>按下游 key 堆叠</option>
        </select>
        <span class="chips" style="margin:0">
          <button class="chip${p === 1 ? " on" : ""}" onclick="setOvPeriod(1)">今日</button>
          <button class="chip${p === 7 ? " on" : ""}" onclick="setOvPeriod(7)">近 7 天</button>
          <button class="chip${p === 30 ? " on" : ""}" onclick="setOvPeriod(30)">近 30 天</button>
        </span>
      </h2>
      ${splitChart}
      </div>
    </div>
    <div class="panel">
      <h2>地域访问地图 <small>按客户端 IP 定位 · ${gran}</small></h2>
      ${regionMapHtml(rg)}

}

        <button class="btn primary sm" onclick="editProvider(null)">+ 新增平台</button>
      </h2>
      ${S.providers.length ? `<table><thead><tr>
        <th>平台</th><th>类型</th><th>Base URL</th><th>API Key</th>
        <th class="num">模型</th><th>思考</th><th>状态</th><th class="num">操作</th>

        提示：下游用 <span class="mono">platform/model</span> 指定平台与模型（例如
        <span class="mono">deepseek/deepseek-chat</span>）；也可以只写模型名，中转站按登记顺序自动挑平台。
        「思考」= 该平台是否允许模型输出思考过程，<b>已关闭</b> 时会要求上游别思考、并把思考内容挡在下游之外。

    </div>
    <div class="panel">
      <h2>全部可用模型 <small>${nf(S.models.length)} 个</small></h2>
      <div class="chips">${(S.models||[]).map(m => `<span class="chip mono">${esc(m)}</span>`).join("") || '<span class="dim">暂无</span>'}</div>

const MR_OPTS = [["auto","跟随客户端"],["off","关闭思考"],["low","低"],["medium","中"],["high","高"]];
const OFF_FIELDS = [["auto","自动（按平台，同 Hermes）"],
                    ["reasoning_effort",'reasoning_effort:"none"'],
                    ["think",'reasoning_effort:"none" + think:false'],
                    ["enable_thinking","enable_thinking:false"],
                    ["thinking_type",'thinking:{"type":"disabled"}'],
                    ["thinking_object",'reasoning:{"enabled":false}'],
                    ["chat_template","chat_template_kwargs"],
                    ["none","不注入字段"]];

function _modalExtra(){
  try { const raw = $("#f_extra").value.trim(); return raw ? JSON.parse(raw) : {}; }
  catch(e){ return null; }
}

function syncRowField(sel){
  const row = sel.closest(".mrow");
  const f = row && row.querySelector(".mrf");
  if(f) f.style.display = (sel.value === "off") ? "" : "none";
}

function renderModelReasoning(){
  const box = $("#f_modelrows");
  if(!box) return;
  const extra = _modalExtra() || {};
  const mr = (extra.model_reasoning && typeof extra.model_reasoning === "object") ? extra.model_reasoning : {};
  if(!S.editModels.length){
    box.innerHTML = '<div class="dim" style="font-size:12px">还没有模型：在上方下拉框选择（聚焦自动拉取）或手动输入添加</div>';
    return;
  }
  box.innerHTML = S.editModels.map(m => {
    const v = mr[m];
    const pol = (typeof v === "string" ? v : (v && v.policy)) || "auto";
    const fld = (v && typeof v === "object" && v.field) || "auto";
    const opts = MR_OPTS.map(([k,l]) => `<option value="${k}" ${pol === k ? "selected" : ""}>${l}</option>`).join("");
    const fopts = OFF_FIELDS.map(([k,l]) => `<option value="${k}" ${fld === k ? "selected" : ""}>${l}</option>`).join("");
    return `<div class="mrow" data-model="${esc(m)}">
      <span class="mono mname" title="${esc(m)}">${esc(m)}</span>
      <input class="mal" placeholder="别名（可选）" value="${esc(S.editAlias[m] || "")}" onchange="aliasChanged(this)"/>
      <select class="mrs" onchange="syncRowField(this)">${opts}</select>
      <select class="mrf" style="display:${pol === "off" ? "block" : "none"}">${fopts}</select>
      <button class="mdel" title="删除这个模型" onclick="delModel('${esc(m)}')">×</button>
    </div>`;
  }).join("");
  buildAddOptions();
}

/* ---- 模型列表：下拉选择 + 别名 + 删除 ---- */
const _availList = {};   // platform -> 拉取到的模型名列表

function buildAddOptions(){
  const sel = $("#f_addmodel"); if(!sel) return;
  const list = _availList[S.editingPlatform] || [];
  sel.innerHTML = '<option value="">— 选择要添加的模型 —</option>' +
    list.filter(m => S.editModels.indexOf(m) < 0)
        .map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join("");
}

async function fetchAvailableModels(force){
  const platform = S.editingPlatform;
  if(!platform) return toast("先保存平台，再拉取模型列表", "err");
  if(!force && S.availFetched) return;
  toast("正在拉取 " + platform + " 的模型列表…");
  try{
    const r = await api("/api/providers/" + encodeURIComponent(platform) + "/available-models");
    _availList[platform] = r.models || [];
    S.availFetched = true;
    buildAddOptions();
    toast("拉取到 " + r.count + " 个模型", "ok");
  }catch(e){
    if(_availList[platform] && !force) return;   // 拉失败但下拉里还有旧列表，不打扰
    toast("拉取失败：" + e.message, "err");
  }
}

function addModel(name){
  name = (name || "").trim();
  if(!name) return;
  if(S.editModels.indexOf(name) >= 0) return;
  S.editModels.push(name);
  buildAddOptions();
  renderModelReasoning();
}

function addManualModel(){
  const inp = $("#f_manualmodel");
  if(inp && inp.value.trim()) addModel(inp.value);
  if(inp) inp.value = "";
}

function delModel(name){
  S.editModels = S.editModels.filter(m => m !== name);
  delete S.editAlias[name];
  buildAddOptions();
  renderModelReasoning();
}

function aliasChanged(input){
  const row = input.closest(".mrow");
  const m = row && row.dataset.model;
  if(!m) return;
  const a = (input.value || "").trim();
  // 清掉所有指向该模型旧别名，再写入新别名
  for (const k of Object.keys(S.editModelMap)) if (S.editModelMap[k] === m) delete S.editModelMap[k];
  if (a && a !== m) S.editModelMap[a] = m;
  S.editAlias[m] = a || "";
}

function collectModelReasoning(extra){
  const mr = {};
  document.querySelectorAll("#f_modelrows .mrow").forEach(row => {
    const m = row.dataset.model;
    const pol = row.querySelector("select.mrs").value;
    const fSel = row.querySelector("select.mrf");
    const fld = fSel ? fSel.value : "auto";
    if(pol === "auto") return;
    mr[m] = (fld === "auto") ? pol : {policy: pol, field: fld};
  });
  if(Object.keys(mr).length) extra.model_reasoning = mr; else delete extra.model_reasoning;
  return extra;
}

function applyPreset(platform){
  const x = S.presets.find(v => v.platform === platform);
  const note = document.getElementById("presetNote");
  if (note) note.style.display = "none";     // 切到自定义/无提示的模板时收起
  if(!x) return;
  $("#f_platform").value = x.platform;
  $("#f_name").value = x.name;
  $("#f_type").value = x.type;
  $("#f_base").value = x.base_url;
  $("#f_proxy").value = x.proxy || "";
  S.editModels = (x.models || []).slice();
  S.editModelMap = {}; S.editAlias = {};
  $("#f_extra").value = JSON.stringify(x.extra || {}, null, 2);
  renderModelReasoning();
  if(x.thinking_off && x.thinking_off !== "auto"){
    document.querySelectorAll("#f_modelrows select.mrf").forEach(s => { s.value = x.thinking_off; });
  }
  // 模板提示常驻在「取消/保存」按钮下方，不自动消失
  if (note && x.note){
    note.innerHTML = `<b>${esc(x.name)}</b>：${esc(x.note)}`;
    note.style.display = "block";
  }
}

function closeModal(){ $("#modal").classList.remove("on"); }

async function saveProvider(platform){
  let extra = {};
  try { const raw = $("#f_extra").value.trim(); if(raw) extra = JSON.parse(raw); }
  catch(e){ return toast("高级配置不是合法 JSON", "err"); }
  extra = collectModelReasoning(extra);
  delete extra.reasoning;        // 平台级思考开关已取消：默认永远跟随客户端
  delete extra.thinking_off;     // 平台级"关闭写法"也取消：改到模型级
  const keys = $("#f_keys").value.split("\n").map(s => s.trim()).filter(Boolean);
  const models = S.editModels.slice();
  const body = {
    platform: platform || $("#f_platform").value.trim(),
    name: $("#f_name").value.trim(),
    type: $("#f_type").value,
    base_url: $("#f_base").value.trim(),
    proxy: $("#f_proxy").value.trim(),
    api_keys: keys,
    models: models,
    model_map: Object.assign({}, S.editModelMap),
    enabled: $("#f_enabled").checked,
    timeout_s: Number($("#f_timeout").value || 300),
    extra: extra
  };
  if(!body.platform) return toast("平台 id 不能为空", "err");
  if(!body.base_url) return toast("Base URL 不能为空", "err");
  try{
    await api("/api/providers", { method:"POST", body: body });
    toast("已保存 " + body.platform, "ok");
    closeModal();
    await refreshAll();
  }catch(e){ toast("保存失败：" + e.message, "err"); }
}

async function delProvider(platform){
  if(!confirm("删除平台 " + platform + "？该平台的模型将不可用。")) return;
  try { await api("/api/providers/" + encodeURIComponent(platform), { method:"DELETE" });
    toast("已删除", "ok"); await refreshAll(); }
  catch(e){ toast("删除失败：" + e.message, "err"); }
}

async function testProvider(platform){
  toast("正在测试 " + platform + " …");
  try{
    const r = await api("/api/providers/" + encodeURIComponent(platform) + "/test", { method:"POST" });
    if(r.ok) toast(`${platform} 可用 · ${fmtMs(r.latency_ms)} · ${JSON.stringify(r.usage||{})}`, "ok");
    else toast(`${platform} 失败：${r.error}`, "err");
  }catch(e){ toast("测试失败：" + e.message, "err"); }
}

async function refreshModels(platform){
  toast("正在拉取 " + platform + " 的模型列表…");
  try{
    const r = await api("/api/providers/" + encodeURIComponent(platform) + "/refresh-models", { method:"POST" });
    toast(`拉取到 ${r.count} 个模型`, "ok");
    await refreshAll();
  }catch(e){ toast("拉取失败：" + e.message, "err"); }
}

/* ---------------- 用量统计 ---------------- */
function usageGroups(){
  const g = [["platform","按平台"],["model","按平台+模型"],["model_only","按模型"],
             ["key","按 API Key"],["dkey","按下游 key"],["day","按天"],["format","按下游协议"]];
  if(S.user && S.user.role === "admin") g.splice(3, 0, ["account","按账号"]);
  return g;
}

async function renderUsage(){
  const box = $("#tab-usage");
  const days = S.usageDays || 30, group = S.usageGroup || "platform";
  const seriesGroup = ["platform","model","key","dkey","account"].indexOf(group) >= 0 ? group : "total";
  const [sum, series, period, latency, heatmap, mix, errors, byModel, seriesPlat] = await Promise.all([
    api(`/api/stats/summary?days=${days}&group_by=${group}`),
    api(`/api/stats/series?days=${days}&group_by=${seriesGroup}`),
    api(`/api/stats/period?days=${days}`),
    api(`/api/stats/latency?days=${days}`),
    api(`/api/stats/heatmap?days=${days}`),
    api(`/api/stats/mix?days=${days}`),
    api(`/api/stats/errors?days=${days}&limit=8`),
    api(`/api/stats/summary?days=${days}&group_by=model_only`),
    api(`/api/stats/series?days=${days}&group_by=platform`),
  ]);
  S.ds = S.ds || {};
  S.ds.usage = series;
  const pickBox = _pick("usage");
  if(S.usagePickGroup !== group){ pickBox.length = 0; S.usagePickGroup = group; }
  const sel = pickBox;
  const pickable = seriesGroup === group;
  const rows = sum.data || [];
  const totals = sum.totals || {};
  const totalTok = Math.max(1, rows.reduce((a, r) => a + Number(r.total_tokens||0), 0));
  const p = period || {};
  const pct = (x) => ((Number(x) || 0) * 100).toFixed(1);
  const mrows = byModel.data || [];
  const donutItems = mrows.slice(0, 8).map(r => ({k: String(r.k || ""), v: r.total_tokens}));
  const restTok = mrows.slice(8).reduce((a, r) => a + Number(r.total_tokens || 0), 0);
  if(restTok > 0) donutItems.push({k: "其他", v: restTok});
  const table = rows.map(r => {
    const k = String(r.k == null ? "" : r.k);
    const on = sel.indexOf(k) >= 0;
    const attrs = pickable
      ? `class="${on ? "sel" : ""}" style="cursor:pointer" data-dim="usage" data-k="${esc(k)}" onclick="togglePick(this)" title="点一下只看这条曲线"`
      : "";
    return `<tr ${attrs}><td class="mono">${esc(k)}</td>
      <td class="num">${nf(r.requests)}</td>
      <td class="num">${nf(r.prompt_tokens)}</td>
      <td class="num">${nf(r.completion_tokens)}</td>
      <td class="num">${nf(r.cached_tokens)}</td>
      <td class="num"><b>${nf(r.total_tokens)}</b></td>
      <td style="width:16%"><div class="bar"><i style="width:${Math.max(2,Math.round(r.total_tokens/totalTok*100))}%"></i></div></td>
      <td class="num">${fmtMs(r.avg_latency_ms)}</td>
      <td class="num">${r.errors ? '<span class="pill err">'+r.errors+'</span>' : '<span class="pill ok">0</span>'}</td>
    </tr>`;
  }).join("");
  box.innerHTML = `
    <div class="panel">
      <h2>用量统计 <small>近 ${days} 天 · 多维分析</small>
        <span style="flex:1"></span>
        <select id="uDays" style="width:120px" onchange="S.usageDays=this.value;renderUsage()">
          ${[1,7,30,90,365].map(d => `<option value="${d}" ${Number(days)===d?"selected":""}>最近 ${d} 天</option>`).join("")}
        </select>
        <a class="btn sm" href="${BASE}/api/stats/export.csv?days=${days}" onclick="return downloadCsv(event)">导出 CSV</a>
      </h2>
      <div class="grid kpis">
        <div class="kpi"><div class="k">区间请求</div><div class="v">${nf(p.requests)}</div>
          <div class="s">累计 ${nf(totals.total_requests)}</div></div>
        <div class="kpi"><div class="k">区间 tokens</div><div class="v">${fmtTok(p.tokens)}</div>
          <div class="s">缓存命中 ${fmtTok(p.cached_tokens)} · 推理 ${fmtTok(p.reasoning_tokens)}</div></div>
        <div class="kpi"><div class="k">平均耗时</div><div class="v">${fmtMs(p.avg_latency_ms)}</div>
          <div class="s">P95 ${fmtMs(p.p95_latency_ms)} · TTFT ${fmtMs(p.avg_ttft_ms)}</div></div>
        <div class="kpi"><div class="k">缓存命中率</div><div class="v">${pct(p.cache_rate)}<span class="dim" style="font-size:14px">%</span></div>
          <div class="s">cached / total tokens</div></div>
        <div class="kpi"><div class="k">成功率</div><div class="v">${pct(p.success_rate)}<span class="dim" style="font-size:14px">%</span></div>
          <div class="s">错误 ${nf(p.errors)} 次</div></div>
        <div class="kpi"><div class="k">流式占比</div><div class="v">${pct(p.stream_rate)}<span class="dim" style="font-size:14px">%</span></div>
          <div class="s">流式 ${nf(p.stream_requests)} 次</div></div>
      </div>
    </div>
    <div class="panel">
      <h2>聚合明细 <small>按平台 / 模型 / API Key / 账号 / 天 / 协议</small>
        <span style="flex:1"></span>
        <select id="uGroup" style="width:150px" onchange="S.usageGroup=this.value;S.usagePickGroup=null;renderUsage()">
          ${usageGroups().map(([v,l]) => `<option value="${v}" ${group===v?"selected":""}>${l}</option>`).join("")}
        </select>
      </h2>
      ${rows.length ? `<table><thead><tr><th>${{day:"日期",format:"协议",key:"平台 · API Key",account:"账号",model_only:"模型"}[group] || "平台 / 模型"}</th>
        <th class="num">请求</th><th class="num">输入</th><th class="num">输出</th>

        <th class="num">平均耗时</th><th class="num">错误</th></tr></thead><tbody>${table}</tbody></table>`
        : '<div class="empty">这个区间还没有请求记录</div>'}
      ${pickable && rows.length ? '<div class="dim" style="font-size:12px;margin-top:8px">点表格任意一行可以只看那条曲线，点多行同时对比；再点一次取消。</div>' : ""}
    </div>
    <div class="panel"><h2>每日 token 曲线
        <small>${sel.length ? "已选 " + sel.length + " 条" : "点上面聚合明细的行来筛选"}</small>
        <span style="flex:1"></span>
        <button class="btn sm" onclick="S.pick.usage.length=0;renderUsage()">显示全部</button>
      </h2>
      <div id="usageChart">${usageChartHtml()}</div></div>
    <div class="split">
      <div class="panel">
        <h2>每日 tokens <small>按上游平台堆叠 · 点图例只看该平台</small>
          ${(S.pick && S.pick.platStack || []).length ? '<button class="btn sm" onclick="S.pick.platStack=[];renderUsage()">重置</button>' : ""}
        </h2>
        ${stackedBarHtml(seriesPlat)}
      </div>
      <div class="panel">
        <h2>模型分布 <small>按 tokens · Top 8</small></h2>
        ${donutHtml(donutItems)}

/* ---------------- 请求日志 ---------------- */
const LOG_PAGE = 100;   // 每页 100 条
const LOG_RANGES = [["15m", "近15分钟"], ["30m", "近30分钟"], ["1h", "近1小时"], ["6h", "近6小时"], ["today", "当日"]];
function quickLogRange(r){   // 快捷相对区间：锚定服务端当前时间，由后端计算边界
  S.logRange = r; S.logDateFrom = S.logDateTo = "";
  S.logPage = 1; renderLogs(1);
}
function quickRangeBtn(r, label){
  return `<button class="btn sm${S.logRange === r ? " on" : ""}" onclick="quickLogRange('${r}')">${label}</button>`;
}
async function renderLogs(page){
  if (!S.logFilters) S.logFilters = {};
  if (S.logRange === undefined && !S.logDateFrom && !S.logDateTo){
    S.logRange = "1h";   // 默认展现最近 1 小时的请求日志
  }
  if (page != null) S.logPage = Math.max(1, page);
  if (S.logTotal && S.logPage > Math.max(1, Math.ceil(S.logTotal / LOG_PAGE)))
    S.logPage = Math.ceil(S.logTotal / LOG_PAGE);   // 数据变少时钳到最后一页
  const f = S.logFilters || {};
  const off = ((S.logPage || 1) - 1) * LOG_PAGE;
  // 筛选条件发给后端，作用于全量记录（不是当前页）；多选值逗号分隔
  const q = new URLSearchParams({ limit: String(LOG_PAGE), offset: String(off) });
  for (const k of ["status", "platform", "model", "key", "ip"])
    if ((f[k] || []).length) q.set(k, f[k].join(","));
  if ((f.type || []).length) q.set("stream", f.type.map(v => v === "流式" ? "1" : "0").join(","));
  if ((f.account || []).length && S.logAcctMap){
    const ids = f.account.map(e => S.logAcctMap[e]).filter(v => v != null);
    if (ids.length) q.set("users", ids.join(","));
  }
  if (S.logRange) q.set("range", S.logRange);
  else { if (S.logDateFrom) q.set("from", S.logDateFrom); if (S.logDateTo) q.set("to", S.logDateTo); }
  const [r, fc] = await Promise.all([
    api("/api/stats/records?" + q.toString()),
    api("/api/stats/logs/facets"),
  ]);
  S.logRows = r.data || [];
  S.logTotal = r.total || 0;
  S.logFacets = fc || {};
  if (fc.accounts) S.logAcctMap = Object.fromEntries(fc.accounts.map(a => [a.email, a.id]));
  // 剔除全局 facets 里已不存在的筛选值，避免显示与生效条件不一致
  const valid = {
    status: new Set(fc.status || []), platform: new Set(fc.platform || []),
    model: new Set(fc.model || []), key: new Set(fc.key_hint || []),
    ip: new Set(fc.client_ip || []),
    account: new Set((fc.accounts || []).map(a => a.email).filter(Boolean)),
  };
  for (const field of ["status", "platform", "model", "key", "ip", "account"]){
    if (!(S.logFilters[field] || []).length) continue;
    const keep = S.logFilters[field].filter(v => valid[field].has(v));
    if (keep.length) S.logFilters[field] = keep; else delete S.logFilters[field];
  }
  drawLogsPanel();
}

function logType(x){ return x.stream ? "流式" : "普通"; }

function uniqSorted(vals){
  const s = new Set();
  for (const v of vals) if (v !== "" && v != null) s.add(v);
  return [...s].sort();
}

/* 筛选项来自全量记录（log_facets），不是当前页 */
function logFilterValues(field){
  const fc = S.logFacets;
  if (field === "type"){
    const sv = fc ? (fc.stream || []) : (S.logRows || []).map(x => x.stream ? 1 : 0);
    const out = [];
    if (sv.includes(1)) out.push("流式");
    if (sv.includes(0)) out.push("普通");
    return out;
  }
  if (fc){
    if (field === "status")   return fc.status || [];
    if (field === "platform") return fc.platform || [];
    if (field === "model")    return fc.model || [];
    if (field === "key")      return fc.key_hint || [];
    if (field === "ip")       return fc.client_ip || [];
    if (field === "account")  return (fc.accounts || []).map(a => a.email).filter(Boolean);
  }
  const rows = S.logRows || [];   // facets 未就绪时的回退
  if (field === "status")   return uniqSorted(rows.map(x => x.status));
  if (field === "platform") return uniqSorted(rows.map(x => x.platform));
  if (field === "model")    return uniqSorted(rows.map(x => x.model));
  if (field === "key")      return uniqSorted(rows.map(x => x.key_hint || "-"));
  if (field === "ip")       return uniqSorted(rows.map(x => x.client_ip || "-"));
  if (field === "account")  return uniqSorted(rows.map(x => x.user_email || "-"));
  return [];
}

const LOG_FILTER_FIELDS = {
  status: "状态", platform: "平台", model: "上游模型", type: "类型",
  account: "账号", key: "API Key", ip: "来源 IP",
};

/* 表头内联箭头筛选：列标题旁只显一个小箭头，选中后追加值/"N 项"并高亮；点开 checkbox 面板可多选 */
function logFilterBtn(field){
  const sel = (S.logFilters || {})[field] || [];
  const extra = sel.length === 1 ? `<span class="thfv">${esc(sel[0])}</span>`
    : (sel.length ? `<span class="thfv">${sel.length} 项</span>` : "");
  return `<button class="thfb${sel.length ? " on" : ""}" title="按${LOG_FILTER_FIELDS[field]}筛选" onclick="thfToggle(event,'${field}')">▾</button>${extra}`;
}

/* 页码条：≤7 页全列；更多页用窗口式 1 … p-1 p p+1 … N */
function logPageBar(page, maxPage){
  if (maxPage <= 1) return "";
  let nums;
  if (maxPage <= 7) nums = Array.from({length: maxPage}, (_, i) => i + 1);
  else {
    const set = new Set([1, 2, maxPage - 1, maxPage, page - 1, page, page + 1]
      .filter(n => n >= 1 && n <= maxPage));
    nums = [...set].sort((a, b) => a - b);
  }
  let html = ""; let last = 0;
  for (const n of nums){
    if (n - last > 1) html += `<span class="pgell">…</span>`;
    html += `<button class="btn sm pg${n === page ? " on" : ""}" onclick="renderLogs(${n})">${n}</button>`;
    last = n;
  }
  return `<span class="pgs">${html}</span>`;
}

function thfToggle(ev, field){
  ev.stopPropagation();
  if (S.thfPop === field){ thfPopClose(); return; }
  document.getElementById("thfpop")?.remove();   // 换一个列时先收起旧面板
  const sel = (S.logFilters || {})[field] || [];
  const pop = document.createElement("div");
  pop.id = "thfpop"; pop.className = "thfpop";
  pop.innerHTML =
    `<div class="thfph">${LOG_FILTER_FIELDS[field] || field}</div>` +
    logFilterValues(field).map(v =>
      `<label class="thfopt"><input type="checkbox" value="${esc(v)}" ${sel.includes(v) ? "checked" : ""}
        onchange="thfPopChange('${field}', this)"><span>${esc(v)}</span></label>`).join("") +
    (sel.length ? `<button class="btn sm" style="width:100%;margin-top:6px" onclick="thfPopClear('${field}')">清空此项</button>` : "");
  document.body.appendChild(pop);
  const r = ev.currentTarget.getBoundingClientRect();
  pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - pop.offsetWidth - 8)) + "px";
  pop.style.top = (r.bottom + 4) + "px";
  if (pop.offsetTop + pop.offsetHeight > window.innerHeight - 8)
    pop.style.top = Math.max(8, window.innerHeight - pop.offsetHeight - 8) + "px";
  S.thfPop = field;
}

function thfPopChange(field, input){
  if (!S.logFilters) S.logFilters = {};
  let sel = (S.logFilters || {})[field] || [];
  if (input.checked){ if (!sel.includes(input.value)) sel = [...sel, input.value]; }
  else sel = sel.filter(v => v !== input.value);
  if (sel.length) S.logFilters[field] = sel; else delete S.logFilters[field];
  S.thfPop = null;                        // 重绘会重建弹出面板
  document.getElementById("thfpop")?.remove();
  S.logPage = 1;
  renderLogs(1);                          // 筛选发后端，作用于全量记录
}

function thfPopClear(field){
  if (S.logFilters) delete S.logFilters[field];
  thfPopClose();
  S.logPage = 1;
  renderLogs(1);
}

function thfPopClose(){
  document.getElementById("thfpop")?.remove();
  S.thfPop = null;
}

// 点面板外 / 滚动 → 收起筛选面板
document.addEventListener("click", ev => {
  if (S.thfPop == null) return;
  if (document.getElementById("thfpop")?.contains(ev.target)) return;
  if (ev.target.closest && ev.target.closest(".thfb")) return;   // 列头按钮交给它自己的 onclick 切换
  thfPopClose();
});
document.addEventListener("scroll", () => { if (S.thfPop != null) thfPopClose(); }, true);

function clearLogFilters(){
  S.logFilters = {};
  S.logRange = "1h"; S.logDateFrom = S.logDateTo = "";   // 恢复默认：最近 1 小时
  renderLogs(1);
}

/* 日志行状态徽章点击 → 弹层显示该请求的元数据 + 上游报错原文（requests.error） */
function logDetail(i){
  const x = (window.__logRows || [])[i];
  if(!x) return;
  const meta = [
    ["时间", fullTs(x.ts)],
    ["平台", x.platform || "-"],
    ["上游模型", x.model || "-"],
    ["类型", logType(x) + " / " + (x.in_format || "openai")],
    ["输入 / 输出 / 合计", nf(x.prompt_tokens) + " / " + nf(x.completion_tokens) + " / " + nf(x.total_tokens) + (x.estimated ? "（估算）" : "")],
    ["耗时 / 首字", fmtMs(x.latency_ms) + " / " + (x.ttft_ms ? fmtMs(x.ttft_ms) : "-")],
    ["下游 Key", x.dkey_label || "-"],
    ["来源 IP", x.client_ip || "-"],
  ];
  if(S.user && S.user.role === "admin") meta.push(["账号", x.user_email || "-"]);
  const pill = x.status === "ok" ? "ok" : x.status === "aborted" ? "warn" : "err";
  const errBody = x.error
    ? `<pre class="mono" style="margin:0;padding:10px 12px;background:var(--panel2);border:1px solid #4a2530;border-radius:8px;max-height:340px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.55;color:#ffb4b4">${esc(x.error)}</pre>`
    : '<div class="empty">这条请求没有记录上游报错细节（可能是客户端中断或超时）</div>';
  $("#modalBody").innerHTML = `
    <h3>请求详情 <span class="pill ${pill}">${esc(x.status)}</span></h3>
    <table style="width:100%;font-size:12.5px;margin-bottom:14px">
      ${meta.map(([k, v]) => `<tr>
        <td class="dim" style="padding:3px 14px 3px 0;white-space:nowrap;vertical-align:top">${k}</td>
        <td class="mono" style="padding:3px 0;word-break:break-all">${esc(String(v ?? "-"))}</td>
      </tr>`).join("")}
    </table>
    <div style="font-size:12px;color:var(--dim);margin-bottom:6px">报错信息（上游返回 / 鉴权拦截）</div>
    ${errBody}
    <div style="margin-top:14px;text-align:right"><button class="btn" onclick="closeModal()">关闭</button></div>`;
  $("#modal").classList.add("on");
}

function drawLogsPanel(){

  const rows = S.logRows || [];
  const f = S.logFilters || {};
  const nFilters = Object.values(f).filter(a => Array.isArray(a) && a.length)
    + ((S.logRange || S.logDateFrom || S.logDateTo) ? 1 : 0);
  const page = S.logPage || 1;
  const maxPage = Math.max(1, Math.ceil((S.logTotal || 0) / LOG_PAGE));

  window.__logRows = rows;   // 供状态徽章点击弹详情用
  const trs = rows.map((x, i) => {
    const st = x.status === "ok" ? '<span class="pill ok">ok</span>'
      : x.status === "aborted" ? '<span class="pill warn">aborted</span>'
      : `<span class="pill err" title="点击查看上游报错" style="cursor:pointer;text-decoration:underline dotted" onclick="logDetail(${i})">${esc(x.status)}</span>`;
    return `<tr>
      <td>${st}</td>
      <td class="mono dim">${esc(fullTs(x.ts))}</td>
      <td class="mono">${esc(x.platform || "-")}</td>
      <td class="mono">${esc(x.model)}</td>

      <td class="num">${nf(x.prompt_tokens)}</td>
      <td class="num">${nf(x.completion_tokens)}</td>
      <td class="num">${nf(x.total_tokens)}${x.estimated ? '<span class="dim" title="估算值"> est</span>' : ""}</td>
      <td class="num">${fmtMs(x.latency_ms)}</td>
      <td class="num">${x.ttft_ms ? fmtMs(x.ttft_ms) : "-"}</td>
      ${admin ? `<td class="mono dim">${esc(x.user_email || "-")}</td>` : ""}
      <td class="mono dim">${esc(x.key_hint || "-")}</td>
      <td class="mono dim">${esc(x.dkey_label || "-")}</td>
      <td class="mono dim">${esc(x.client_ip || "-")}</td>

  }).join("");

  const thCell = (label, ctrl, num) => `<th${num ? ' class="num"' : ""}><div class="thf"><span>${label}</span>${ctrl || ""}</div></th>`;
  const head = [
    thCell("状态", logFilterBtn("status")),
    thCell("时间"),
    thCell("平台", logFilterBtn("platform")),
    thCell("上游模型", logFilterBtn("model")),
    thCell("类型", logFilterBtn("type")),
    thCell("输入", null, true), thCell("输出", null, true), thCell("合计", null, true),
    thCell("耗时", null, true), thCell("首字", null, true),
    ...(admin ? [thCell("账号", logFilterBtn("account"))] : []),
    thCell("API Key", logFilterBtn("key")),
    thCell("下游 Key"),
    thCell("来源 IP", logFilterBtn("ip")),
  ].join("");

  const dateInput = (id, val, key) =>
    `<input type="datetime-local" step="1" id="${id}" value="${val || ""}"
      onchange="S.${key} = this.value || ''; S.logRange = ''; S.logPage = 1; renderLogs(1)"
      style="font-size:11.5px;width:170px;padding:2px 4px">`;
  box.innerHTML = `<div class="panel">
    <h2>请求日志 <small>第 ${page} / ${maxPage} 页 · 共 ${nf(S.logTotal)} 条${nFilters ? ` · ${nFilters} 组筛选（全量生效）` : ""}</small>
      <span style="flex:1"></span>
      <span style="display:flex;gap:5px;align-items:center;flex:none">
        ${LOG_RANGES.map(([r, l]) => quickRangeBtn(r, l)).join("")}
        <span class="dim" style="font-size:12px">开始</span>${dateInput("logFrom", S.logDateFrom, "logDateFrom")}
        <span class="dim" style="font-size:12px">~</span>${dateInput("logTo", S.logDateTo, "logDateTo")}
        <span class="dim" style="font-size:12px">结束</span>
      </span>
      <button class="btn sm" ${page <= 1 ? "disabled" : ""} onclick="renderLogs(${page - 1})">上一页</button>

      ${nFilters ? `<button class="btn sm" onclick="clearLogFilters()">清除筛选</button>` : ""}
      <button class="btn sm" onclick="renderLogs()">刷新</button></h2>
    ${(() => {
      const nCols = 12 + (admin ? 1 : 0);   // 与 head 的列数一致（管理员多一列「账号」）
      const emptyRow = rows.length ? "" :
        `<tr><td colspan="${nCols}" style="text-align:center;padding:28px 8px;color:var(--dim)">没有符合条件的记录${nFilters ? '（试试清除筛选或调整日期区间）' : ''}</td></tr>`;
      return `<div class="tw"><table class="logtable"><thead><tr>${head}</tr></thead><tbody>${trs}${emptyRow}</tbody></table></div>`;
    })()}
  </div>`;
}

  try{ await api(`/api/users/${id}`, { method: "PATCH", body: { password: pw } });
    toast("密码已重置，对方需要重新登录", "ok"); renderUsers(); }
  catch(e){ toast("失败：" + e.message, "err"); }
}

async function toggleRole(id, role){
  const next = role === "admin" ? "user" : "admin";
  if(!confirm(next === "admin" ? "把该账号设为管理员？他将能看到所有账号的数据。" : "取消该账号的管理员身份？")) return;
  try{ await api(`/api/users/${id}`, { method: "PATCH", body: { role: next } });
    toast(next === "admin" ? "已设为管理员" : "已取消管理员", "ok"); renderUsers(); }
  catch(e){ toast("失败：" + e.message, "err"); }
}

async function toggleUser(id, status){
  const next = status === "active" ? "disabled" : "active";
  if(next === "disabled" && !confirm("禁用后该账号立即无法登录、API Key 也会失效，确定？")) return;
  try{ await api(`/api/users/${id}`, { method: "PATCH", body: { status: next } });
    toast(next === "active" ? "已启用" : "已禁用", "ok"); renderUsers(); }
  catch(e){ toast("失败：" + e.message, "err"); }
}

async function delUser(id){
  if(!confirm("彻底删除该账号？\n它的会话和 API Key 立即失效，邮箱可被重新注册；请求历史保留作审计。")) return;
  try{ await api(`/api/users/${id}`, { method: "DELETE" });
    toast("账号已删除", "ok"); renderUsers(); }
  catch(e){ toast("删除失败：" + e.message, "err"); }

/* 新建 Key：弹窗（备注 + 过期日期日历，精确到日；留空 = 永不过期）。
   点「取消」只关弹窗、不生成 key；点「确定」才 POST 创建。 */
async function newKey(){
  const body = $("#modalBody");
  body.innerHTML = `
    <h3>新建 Key</h3>
    <div class="field"><label>备注（可留空，会显示在统计/日志的「下游 Key」里）</label>
      <input id="nkLabel" maxlength="60" placeholder="例如：Hermes 桌面端 / 定时任务" style="max-width:340px"></div>

      <input id="nkExpire" type="date" style="max-width:220px"></div>
    <div class="row" style="justify-content:flex-end;margin-top:18px">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn primary" onclick="createKey()">确定</button>
    </div>`;

async function createKey(){
  const label = $("#nkLabel").value.trim();
  const exp = $("#nkExpire").value;   // "YYYY-MM-DD" 或 ""（永不过期）
  try{
    const r = await api("/api/keys", { method: "POST", body: { label, expires_at: exp } });
    closeModal();
    copyText(r.key);
    alert("新 Key 已创建（并尝试复制到剪贴板）：\n\n" + r.key
      + (r.expires_at ? "\n\n过期时间：" + r.expires_at.slice(0,10) + "（当天仍可用）" : "\n\n永不过期"));
    renderSettings();
  }catch(e){ toast("创建失败：" + e.message, "err"); }

/* 改过期：弹窗日历控件，精确到日；cur = 当前过期日（YYYY-MM-DD，无则空） */
function editKeyExpire(id, cur){

async function saveKeyExpire(id){

async function copyKey(id){

  }catch(e){ toast("获取 key 失败：" + e.message, "err"); }

async function delKey(id){

async function changePassword(){

    setTimeout(() => logout(), 800);

function copyText(t){
  const done = () => toast("已复制到剪贴板", "ok");
  const fallback = () => {                    // 局域网 http 下 clipboard API 不可用时的兜底
    const ta = el("textarea", { style: "position:fixed;top:-1000px;opacity:0" });
    ta.value = t;
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try{ ok = document.execCommand("copy"); }catch(e){ ok = false; }
    ta.remove();
    ok ? done() : toast("复制失败，请手动选中复制", "err");
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(t).then(done).catch(fallback);
  } else {
    fallback();
  }
}

/* 表格比 panel 宽时，让 panel 自己横向滚动，而不是撑破圆角边框 */
function fitTables(){
  document.querySelectorAll("table").forEach(t => {
    const par = t.parentElement;
    if(!par || par.classList.contains("tw")) return;
    const w = document.createElement("div");
    w.className = "tw";
    par.insertBefore(w, t);
    w.appendChild(t);
  });
}
new MutationObserver(fitTables).observe(document.body, { childList: true, subtree: true });

  S.tab = tab;

(function boot(){
  api("/api/auth/status").then(st => {
    if(st.user){ S.user = st.user; enterApp().catch(() => showLogin()); }
    else {
      showLogin();
      if(!st.has_users){
        S.authMode = "login"; toggleAuthMode();   // 一个账号都没有 → 直接进注册态
      }
    }
  }).catch(() => showLogin());
})();
