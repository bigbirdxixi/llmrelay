# ============================================================================
#  给 docker compose 里的 nginx 用（--profile with-nginx 时挂进容器）
#  对外地址示例：https://your-domain.com/llmrelay/v1
#
#  关键点：
#   - proxy_pass 结尾的 / 会把 /llmrelay 前缀剥掉，网关收到的是 /v1/...；
#     网关本来也接受带前缀的 /llmrelay/v1/...，两种都行，别两边都改。
#   - SSE 必须关缓冲：proxy_buffering off + proxy_http_version 1.1
#   - 流式可能很久没有新 token：proxy_read_timeout 给到 600s
# ============================================================================

# --- 80：跳 https（有 certbot 的话保留 /.well-known）---
server {
    listen 80;
    server_name your-domain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- 443：网关本体挂在 /llmrelay/ 下 ---
server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 32m;      # 长上下文请求体

    location /llmrelay/ {
        # 结尾的 / 很关键：把 /llmrelay 前缀从路径里去掉
        proxy_pass http://llm-relay:8800/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # ---- SSE / 流式 ----
        proxy_buffering     off;
        proxy_cache         off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }

    # 想同时保留根路径访问（本地调试用）就打开下面这段
    # location / {
    #     proxy_pass http://llm-relay:8800/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_buffering off;
    #     proxy_read_timeout 600s;
    # }
}
