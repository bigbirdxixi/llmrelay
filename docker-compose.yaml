# ============================================================================
#  LLM Relay —— 生产部署（docker compose）
#
#  用法：
#    1) 把 config/、data/ 放在本文件同目录
#    2) docker compose build
#    3) docker compose up -d
#    4) docker compose logs -f --tail=100      # 首启会打印控制台地址
#
#  说明：
#  - 端口只发布到 127.0.0.1，由宿主机上的 Nginx/Caddy 终结 TLS 再转发进来；
#    要直接对外，把下面 ports 的 127.0.0.1: 去掉（并自己配好 TLS / 防火墙）。
#  - config/ 与 data/ 是 bind mount：删容器不丢配置、不丢用量库。
# ============================================================================
name: llm-relay

services:
  llm-relay:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-relay:${RELAY_VERSION:-1.0.1}
    container_name: llm-relay
    restart: unless-stopped
    init: true                      # 让 PID 1 正确转发 SIGTERM，流式连接能优雅退出

    environment:
      TZ: ${TZ:-Asia/Shanghai}

      # ---- 监听 ----
      # 容器内必须监听 0.0.0.0，否则 Docker 端口映射进不来（默认值是 127.0.0.1）
      RELAY_HOST: "0.0.0.0"
      RELAY_PORT: "8800"

      # ---- 目录（可省略，默认就是这两个）----
      RELAY_CONFIG_DIR: /app/config
      RELAY_DATA_DIR: /app/data

      # ---- 反代 ----
      # 端口只绑 127.0.0.1，能打到网关的只有宿主机上的反代，所以这里放开信任没有问题。
      # 想更严格可改成 "127.0.0.1,172.17.0.1"（后者是 docker0 网关，按实际网段调整）。
      RELAY_FORWARDED_ALLOW_IPS: "*"

      # ---- 子路径 ----
      # 情况 A：Nginx 用 proxy_pass http://127.0.0.1:8800/;（结尾带 /，会剥掉前缀）
      #         → 这里留空即可
      # 情况 B：Nginx 保留前缀（proxy_pass .../ 不带结尾 /，或 rewrite 保留）
      #         → 填 /llmrelay（等价于控制台「设置 → 访问路径」里填，两边任选其一）
      # 注意：设了环境变量后，控制台里的该项会被锁定（不生效），以环境变量为准。
      RELAY_BASE_PATH: ${RELAY_BASE_PATH:-}


      # ---- 直接对外 HTTPS（不挂反代时才用；挂反代时留空）----
      # RELAY_SSL_CERTFILE: /app/config/certs/fullchain.pem
      # RELAY_SSL_KEYFILE:  /app/config/certs/privkey.pem

      # ---- 地域地图（概览页「地域访问地图」，可选）----
      # 把 GeoLite2-City.mmdb（MaxMind 免费）放到 ./geoip/ 下，并取消下一行注释：
      # RELAY_GEOIP_DB: /app/geoip/GeoLite2-City.mmdb
      # 不设时该功能自动关闭（页面显示配置提示），其余功能不受影响

    volumes:
      - ./config:/app/config      # upstreams.json / settings.json / 证书
      - ./data:/app/data          # relay.db（用量库）
      # - ./geoip:/app/geoip       # GeoLite2-City.mmdb（地域地图，可选）

    ports:
      # 只给本机反代用；直接对外就去掉 127.0.0.1:
      - "127.0.0.1:${RELAY_PUBLISH_PORT:-8800}:8800"

    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8800/healthz', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    # 流式请求可能正在吐 token，给足退出时间，避免客户端被硬切
    stop_grace_period: 30s

    security_opt:
      - no-new-privileges:true

    # SQLite 是单文件 + 单进程写，不要起多副本；资源上限按需调整
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ---------------------------------------------------------------------------
# 可选：把 Nginx 也放进同一个 compose（不想用宿主机 Nginx 时启用）
#   docker compose --profile with-nginx up -d
#   证书目录：./deploy/certs/fullchain.pem、privkey.pem
# ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: llm-relay-nginx
    profiles: ["with-nginx"]
    restart: unless-stopped
    depends_on:
      llm-relay:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
